<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>វិញ្ញាសាប្រឡងតេស្តសមត្ថភាព៖ វ៉ិចទ័រទីតាំង</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; }
        body { font-family: 'Khmer OS Battambang', sans-serif; background: #f4f7f6; padding: 20px; color: #333; line-height: 1.7; }
        .quiz-container { max-width: 850px; margin: auto; background: #fff; padding: 35px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; border-bottom: 3px solid var(--accent); padding-bottom: 15px; }
        .student-info { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; background: #eef5f9; padding: 20px; border-radius: 8px; border-left: 5px solid var(--accent); }
        .student-info div { display: flex; flex-direction: column; }
        .student-info label { font-weight: bold; margin-bottom: 5px; color: var(--primary); }
        input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1em; }
        .question-box { margin-bottom: 30px; padding: 20px; border: 1px solid #e1e8ed; background: #fff; border-radius: 8px; }
        .question-title { font-weight: bold; color: var(--primary); margin-bottom: 15px; font-size: 1.05em; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-left: 10px; }
        .options label { cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 5px; border-radius: 4px; }
        .options label:hover { background: #f0f4f8; }
        .btn-submit { width: 100%; padding: 15px; background: var(--success); color: white; border: none; font-size: 1.2em; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background: #219150; }
        .feedback { margin-top: 15px; padding: 15px; display: none; border-radius: 6px; font-size: 0.95em; }
        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        #summary { text-align: center; margin-top: 30px; font-weight: bold; font-size: 1.4em; color: var(--primary); padding: 20px; background: #e8f8f5; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>📝 វិញ្ញាសាប្រឡងតេស្តសមត្ថភាព៖ វ៉ិចទ័រទីតាំង (Shuffle គ្រប់លំដាប់)</h1>
    
    <div class="student-info">
        <div>
            <label for="sName">ឈ្មោះសិស្ស៖</label>
            <input type="text" id="sName" placeholder="វាយបញ្ចូលឈ្មោះនៅទីនេះ...">
        </div>
        <div>
            <label for="sClass">ថ្នាក់រៀន៖</label>
            <input type="text" id="sClass" placeholder="ឧទាហរណ៍៖ ១១អា">
        </div>
    </div>

    <form id="quizForm"></form>
    
    <button type="button" class="btn-submit" onclick="evaluateQuiz()">បញ្ជូនវិញ្ញាសា និងពិនិត្យលទ្ធផល</button>
    <div id="summary"></div>
</div>

<script>
    // ទិន្នន័យសំណួរទាំង ២៥ សំណួរ
    const questions = [
        { q: "រកចំណុចកណ្តាលនៃ $A(3, -1)$ និង $B(7, 5)$?", opt: ["$(10, 4)$", "$(2, 3)$", "$(5, 2)$", "$(4, 6)$"], ans: "$(5, 2)$", exp: "ប្រើរូបមន្តចំណុចកណ្តាល $M = \\left( \\frac{x_a+x_b}{2}, \\frac{y_a+y_b}{2} \\right) = \\left( \\frac{3+7}{2}, \\frac{-1+5}{2} \\right) = (5, 2)$" },
        { q: "ចំណុច $C$ ចែក $AB$ ខាងក្នុងតាមផលធៀប $2:1$។ តើវ៉ិចទ័រ $\\vec{c}$ ស្មើនឹងអ្វី?", opt: ["$\\frac{2\\vec{b}+\\vec{a}}{3}$", "$\\frac{\\vec{b}+2\\vec{a}}{3}$", "$\\frac{\\vec{2b}-\\vec{a}}{3}$", "$\\frac{\\vec{a}+\\vec{b}}{3}$"], ans: "$\\frac{2\\vec{b}+\\vec{a}}{3}$", exp: "រូបមន្តចែកខាងក្នុង៖ $\\vec{c} = \\frac{m\\vec{b}+n\\vec{a}}{m+n}$ ជំនួស $m=2, n=1$ គេបាន $\\frac{2\\vec{b}+\\vec{a}}{3}$" },
        { q: "រកចំណុច $D$ ចែក $AB$ ខាងក្រៅតាមផលធៀប $2:1$ បើ $A(1,2)$ និង $B(4,5)$?", opt: ["$(7, 8)$", "$(5, 6)$", "$(3, 3)$", "$(9, 12)$"], ans: "$(7, 8)$", exp: "រូបមន្តចែកខាងក្រៅ៖ $x_d = \\frac{m x_b - n x_a}{m-n} = \\frac{2(4)-1(1)}{2-1}=7$ និង $y_d = \\frac{2(5)-1(2)}{2-1}=8$ ដូចនេះបាន $(7, 8)$" },
        { q: "បើ $P(5, y)$ ជាចំណុចកណ្តាលនៃ $AB$ ដែល $A(x, 4)$ និង $B(3, 8)$។ រកតម្លៃ $x$ និង $y$?", opt: ["$x=2, y=6$", "$x=7, y=6$", "$x=7, y=12$", "$x=4, y=6$"], ans: "$x=7, y=6$", exp: "តាមរូបមន្ត៖ $5 = \\frac{x+3}{2} \\Rightarrow x=7$ និង $y = \\frac{4+8}{2} = 6$" },
        { q: "តើវ៉ិចទ័រទីតាំងនៃចំណុចមួយត្រូវបានកំណត់ធៀបនឹងអ្វី?", opt: ["ចំណុចកណ្តាល", "គល់ $O$ ថេរមួយ", "គ្មានចំណុចកំណត់", "វ៉ិចទ័រឯកតា"], ans: "គល់ $O$ ថេរមួយ", exp: "វ៉ិចទ័រទីតាំង $\\vec{OP}$ គឺជាវ៉ិចទ័រដែលមានគល់ស្ថិតនៅត្រង់គល់កូអរដោនេ $O$ ថេរជានិច្ច។" },
        { q: "គេមាន $\\vec{a}=(2, 4)$ និង $\\vec{b}=(6, 8)$។ រកចំណុចកណ្តាលនៃ $AB$?", opt: ["$(4, 6)$", "$(8, 12)$", "$(2, 2)$", "$(3, 5)$"], ans: "$(4, 6)$", exp: "កូអរដោនេចំណុចកណ្តាលគឺ $M = \\left(\\frac{2+6}{2}, \\frac{4+8}{2}\\right) = (4, 6)$" },
        { q: "ក្នុងរូបមន្តចែកខាងក្រៅ $\\vec{d} = \\frac{m\\vec{b}-n\\vec{a}}{m-n}$ តើលក្ខខណ្ឌនៃ $m$ និង $n$ គឺអ្វី?", opt: ["$m=n$", "$m+n=0$", "$m \\neq n$", "$m>n$"], ans: "$m \\neq n$", exp: "ដើម្បីកុំឱ្យភាគបែងស្មើនឹងសូន្យ ($m-n \\neq 0$) នោះលក្ខខណ្ឌចាំបាច់គឺ $m \\neq n$។" },
        { q: "ក្នុងលំហ គេមាន $A(2,-1,3)$ និង $B(5,2,-3)$។ រកចំណុចចែកក្រៅតាមផលធៀប $2:1$?", opt: ["$(8, 5, -9)$", "$(3, 3, -6)$", "$(7, 4, -9)$", "$(12, 6, -3)$"], ans: "$(8, 5, -9)$", exp: "គណនាតាមរូបមន្តចែកក្រៅក្នុងលំហបីវិមាត្រ៖ $x = \\frac{2(5)-1(2)}{1}=8, y = \\frac{2(2)-1(-1)}{1}=5, z = \\frac{2(-3)-1(3)}{1}=-9$" },
        { q: "បើ $G$ ជាទីប្រជុំទម្ងន់នៃត្រីកោណ $ABC$ តើវ៉ិចទ័រទីតាំង $\\vec{g}$ កំណត់ដោយរូបមន្តណា?", opt: ["$\\frac{\\vec{a}+\\vec{b}}{2}$", "$\\frac{\\vec{a}+\\vec{b}}{3}$", "$\\frac{\\vec{a}+\\vec{b}+\\vec{c}}{3}$", "$\\frac{\\vec{a}+\\vec{b}+\\vec{c}}{2}$"], ans: "$\\frac{\\vec{a}+\\vec{b}+\\vec{c}}{3}$", exp: "ទីប្រជុំទម្ងន់ត្រីកោណគឺជាមធ្យមភាគនៃវ៉ិចទ័រទីតាំងកំពូលទាំងបី៖ $\\vec{g} = \\frac{\\vec{a}+\\vec{b}+\\vec{c}}{3}$" },
        { q: "គេមាន $A(1,-3)$ និង $B(5,9)$។ រកចំណុច $C$ ដែលចែកអង្កត់ $AB$ ខាងក្នុងតាមផលធៀប $1:2$?", opt: ["$(3, 3)$", "$(2, 1)$", "$(2, 3)$", "$(7/3, 1)$"], ans: "$(7/3, 1)$", exp: "$x_c = \\frac{1(5)+2(1)}{1+2} = \\frac{7}{3}$ និង $y_c = \\frac{1(9)+2(-3)}{1+2} = \\frac{3}{3}=1$ ដូចនេះ $C(\\frac{7}{3}, 1)$" },
        { q: "បើ $A(-2,3)$ និង $B(4,-5)$ តើកូអរដោនេចំណុចកណ្តាល $M$ ស្មើនឹងប៉ុន្មាន?", opt: ["$(1, -1)$", "$(2, -2)$", "$(1, 1)$", "(-1, 1)"], ans: "$(1, -1)$", exp: "$M = \\left( \\frac{-2+4}{2}, \\frac{3-5}{2} \\right) = (1, -1)$" },
        { q: "បើវ៉ិចទ័រទីតាំង $\\vec{a}=(1,2)$ និង $\\vec{b}=(3,4)$ តើវ៉ិចទ័រ $\\vec{AB}$ មានកូអរដោនេប៉ុន្មាន?", opt: ["$(2, 2)$", "$(-2, -2)$", "$(4, 6)$", "$(2, 6)$"], ans: "$(2, 2)$", exp: "$\\vec{AB} = \\vec{b} - \\vec{a} = (3-1, 4-2) = (2, 2)$" },
        { q: "គេមាន $A(0,0)$ និង $B(5,10)$។ រកចំណុច $C$ ចែកក្នុងតាមផលធៀប $3:2$?", opt: ["$(3, 6)$", "$(2, 4)$", "$(1, 2)$", "$(5, 10)$"], ans: "$(3, 6)$", exp: "$x = \\frac{3(5)+2(0)}{5} = 3$ និង $y = \\frac{3(10)+2(0)}{5} = 6$" },
        { q: "តើលក្ខខណ្ឌផលធៀប $m:n$ សម្រាប់ចំណុចបែងចែកខាងក្នុងត្រូវតែជាយ៉ាងណា?", opt: ["$m,n < 0$", "$m,n > 0$", "$m = n$", "$m - n = 0$"], ans: "$m,n > 0$", exp: "ការបែងចែកខាងក្នុងតម្រូវឱ្យផលធៀបប្រវែងទាំងពីរមានទិសដៅដូចគ្នា ដូចនេះ $m$ និង $n$ ត្រូវតែវិជ្ជមាន ($>0$)។" },
        { q: "ក្នុងលំហ គេមាន $A(1,0,2)$ និង $B(3,4,0)$។ រកកូអរដោនេចំណុចកណ្តាល $I$?", opt: ["$(2,2,1)$", "$(1,2,1)$", "$(2,2,2)$", "$(1,1,1)$"], ans: "$(2,2,1)$", exp: "$I = \\left( \\frac{1+3}{2}, \\frac{0+4}{2}, \\frac{2+0}{2} \\right) = (2, 2, 1)$" },
        { q: "រកទីប្រជុំទម្ងន់ $G$ នៃត្រីកោណ $ABC$ បើ $A(1,1), B(2,3), C(3,2)$?", opt: ["$(2, 2)$", "$(1, 3)$", "$(3, 1)$", "$(2, 3)$"], ans: "$(2, 2)$", exp: "$G = \\left( \\frac{1+2+3}{3}, \\frac{1+3+2}{3} \\right) = (2, 2)$" },
        { q: "វ៉ិចទ័រទីតាំង $\\vec{OP}$ មានគល់ស្ថិតនៅត្រង់ចំណុចណា?", opt: ["ចំណុច P", "ចំណុចគល់ O", "ចំណុចកណ្តាល", "ចំណុចអនន្ត"], ans: "ចំណុចគល់ O", exp: "អក្សរដំបូងនៃវ៉ិចទ័រតំណាងឱ្យគល់ ដូចនេះ $\\vec{OP}$ មានគល់នៅ $O$។" },
        { q: "បើទំនាក់ទំនងវ៉ិចទ័រគឺ $\\vec{c} = \\frac{\\vec{a}+\\vec{b}}{2}$ តើចំណុច $C$ ជាអ្វីនៃអង្កត់ $AB$?", opt: ["ចំណុចកាត់ធៀប $1:3$", "ចំណុចកណ្តាល", "ចំណុចចែកខាងក្រៅ", "ទីប្រជុំទម្ងន់"], ans: "ចំណុចកណ្តាល", exp: "នេះជារូបមន្តវ៉ិចទ័រទីតាំងនៃចំណុចកណ្តាលនៃអង្កត់មួយ។" },
        { q: "គេមាន $A(1,1)$ និង $B(2,2)$។ រកចំណុចបែងចែកខាងក្រៅតាមផលធៀប $3:1$?", opt: ["$(2.5, 2.5)$", "$(1.5, 1.5)$", "$(3, 3)$", "$(0, 0)$"], ans: "$(2.5, 2.5)$", exp: "$x = \\frac{3(2)-1(1)}{3-1} = \\frac{5}{2} = 2.5$ ដូចគ្នាដែរ $y = 2.5$ នាំឱ្យបាន $(2.5, 2.5)$" },
        { q: "បើចំណុច $M$ ជាចំណុចកណ្តាលនៃអង្កត់ $AB$ តើផលបូកវ៉ិចទ័រ $\\vec{MA} + \\vec{MB}$ ស្មើនឹងប៉ុន្មាន?", opt: ["$\\vec{0}$", "$2\\vec{MA}$", "$\\vec{AB}$", "$-\\vec{AB}$"], ans: "$\\vec{0}$", exp: "ដោយសារ $M$ នៅកណ្តាល នាំឱ្យវ៉ិចទ័រ $\\vec{MA}$ និង $\\vec{MB}$ មានប្រវែងស្មើគ្នា តែកាលណាមានទិសដៅផ្ទុយគ្នា ផលបូកស្មើវ៉ិចទ័រសូន្យ។" },
        { q: "ក្នុងលំហ គេមាន $A(2,-1,3)$ និង $B(0,3,1)$។ រកចំណុចកណ្តាល $M$?", opt: ["$(1, 1, 2)$", "$(2, 1, 2)$", "$(1, 2, 1)$", "$(2, 2, 2)$"], ans: "$(1, 1, 2)$", exp: "$M = \\left( \\frac{2+0}{2}, \\frac{-1+3}{2}, \\frac{3+1}{2} \\right) = (1, 1, 2)$" },
        { q: "បើវ៉ិចទ័រ $\\vec{p}=(x,y)$ និង $\\vec{q}=(z,w)$ តើផលបូក $\\vec{p}+\\vec{q}$ ស្មើនឹងអ្វី?", opt: ["$(x+z, y+w)$", "$(x+y, z+w)$", "$(x+w, y+z)$", "$(x, y)$"], ans: "$(x+z, y+w)$", exp: "ផលបូកពីរវ៉ិចទ័រ គឺត្រូវយកកូអរដោនេតាមអ័ក្សនីមួយៗមកបូកបញ្ចូលគ្នា।" },
        { q: "ចំណុច $C$ ចែកអង្កត់ $AB$ ខាងក្នុងតាមផលធៀប $1:3$។ តើរូបមន្តវ៉ិចទ័រ $\\vec{c}$ គឺមួយណា?", opt: ["$\\frac{3\\vec{a}+\\vec{b}}{4}$", "$\\frac{\\vec{a}+3\\vec{b}}{4}$", "$\\frac{\\vec{a}+\\vec{b}}{4}$", "$\\frac{3\\vec{b}-\\vec{a}}{2}$"], ans: "$\\frac{3\\vec{a}+\\vec{b}}{4}$", exp: "តាមរូបមន្ត $\\vec{c} = \\frac{m\\vec{b}+n\\vec{a}}{m+n}$ ជាមួយ $m=1, n=3$ គេបាន $\\vec{c} = \\frac{1\\vec{b}+3\\vec{a}}{1+3} = \\frac{3\\vec{a}+\\vec{b}}{4}$" },
        { q: "តើរូបមន្តចម្ងាយរវាងពីរចំណុច $A(x_1, y_1)$ និង $B(x_2, y_2)$ កំណត់ដោយរបៀបណា?", opt: ["$\\sqrt{(x_2-x_1)^2 + (y_2-y_1)^2}$", "$\\frac{x_1+x_2}{2}$", "$(x_2-x_1) + (y_2-y_1)$", "$(x_1x_2) + (y_1y_2)$"], ans: "$\\sqrt{(x_2-x_1)^2 + (y_2-y_1)^2}$", exp: "ចម្ងាយរវាងពីរចំណុចគណនាតាមទ្រឹស្តីបទពីតាករ៖ $AB = \\sqrt{(x_2-x_1)^2 + (y_2-y_1)^2}$" },
        { q: "ក្នុងត្រីកោណ $ABC$ ដែលមាន $G$ ជាទីប្រជុំទម្ងន់ តើផលបូកវ៉ិចទ័រ $\\vec{GA} + \\vec{GB} + \\vec{GC}$ ស្មើនឹងប៉ុន្មាន?", opt: ["$\\vec{0}$", "$\\vec{G}$", "$\\vec{ABC}$", "$3\\vec{G}$"], ans: "$\\vec{0}$", exp: "តាមលក្ខណៈពិសេសនៃទីប្រជុំទម្ងន់ ផលបូកវ៉ិចទ័រពីទីប្រជុំទម្ងន់ទៅកាន់កំពូលទាំងបីតែងតែស្មើនឹងវ៉ិចទ័រសូន្យជានិច្ច។" }
    ];

    // មុខងារសម្រាប់ Shuffle Array (Algorithm: Fisher-Yates)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // ១. ធ្វើការ Shuffle លំដាប់លំហាត់ (Questions Shuffle)
    const shuffledQuestions = shuffle([...questions]);

    const form = document.getElementById('quizForm');
    shuffledQuestions.forEach((item, i) => {
        // ២. ធ្វើការ Shuffle លំដាប់ជម្រើសចម្លើយនៅក្នុងសំណួរនីមួយៗ (Options Shuffle)
        let shuffledOptions = shuffle([...item.opt]);

        let optHtml = shuffledOptions.map(o => `
            <label>
                <input type="radio" name="q${i}" value="${o}"> ${o}
            </label>
        `).join('');
        
        form.innerHTML += `
            <div class="question-box">
                <div class="question-title">សំណួរទី ${i+1}: ${item.q}</div>
                <div class="options">${optHtml}</div>
                <div id="r${i}" class="feedback"></div>
            </div>
        `;
    });

    // មុខងារកែពិន្ទុ និងបង្ហាញដំណោះស្រាយ
    function evaluateQuiz() {
        const name = document.getElementById('sName').value.trim();
        const sClass = document.getElementById('sClass').value.trim();

        if (!name || !sClass) {
            alert("សូមបំពេញឈ្មោះ និងថ្នាក់រៀនរបស់សិស្សជាមុនសិន!");
            return;
        }

        let score = 0;
        shuffledQuestions.forEach((item, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const resBox = document.getElementById(`r${i}`);
            resBox.style.display = "block";

            if (selected && selected.value === item.ans) {
                score++;
                resBox.className = "feedback correct";
                resBox.innerHTML = "✅ <b>ត្រឹមត្រូវ!</b> ដំណោះស្រាយ៖ " + item.exp;
            } else {
                resBox.className = "feedback incorrect";
                resBox.innerHTML = "❌ <b>មិនត្រឹមត្រូវទេ!</b> ចម្លើយដែលត្រូវគឺ៖ " + item.ans + "<br>💡 <b>ការពន្យល់៖</b> " + item.exp;
            }
        });

        const summaryBox = document.getElementById('summary');
        summaryBox.style.display = "block";
        summaryBox.innerHTML = `🎓 បេក្ខជន៖ ${name} | ថ្នាក់៖ ${sClass} <br> 📊 លទ្ធផលទទួលបាន៖ ${score} / ${shuffledQuestions.length} សំណួរ (ចំណាត់ថ្នាក់៖ ${Math.round((score/25)*100)}%)`;
        
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
        
        summaryBox.scrollIntoView({ behavior: 'smooth' });
    }
</script>
